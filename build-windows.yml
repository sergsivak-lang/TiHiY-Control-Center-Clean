name: Build Windows Portable

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore src/TiHiY.ControlCenter/TiHiY.ControlCenter.csproj

      - name: Publish Windows x64
        run: dotnet publish src/TiHiY.ControlCenter/TiHiY.ControlCenter.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TiHiY-Control-Center-win-x64
          path: publish/
